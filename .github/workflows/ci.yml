name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 单测 + 集成（真实本地后端子进程）+ PGlite SQL + 构建 + 体积预算 + 文案/色彩断言
      - run: npm run check
